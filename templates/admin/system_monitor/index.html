{% extends "admin/master.html" %}
{% block body %}
<div class="container-fluid">
    <h3 class="mb-4">📊 Мониторинг системы</h3>

    <div class="row">
        <!-- CPU -->
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-header bg-primary text-white">🧠 CPU</div>
                <div class="card-body">
                    <div class="progress mb-2" style="height: 25px;">
                        <div id="cpu-bar" class="progress-bar" role="progressbar" style="width: 0%">0%</div>
                    </div>
                    <small class="text-muted">Загрузка ядер в реальном времени</small>
                </div>
            </div>
        </div>

        <!-- RAM -->
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-header bg-success text-white">💾 Оперативная память</div>
                <div class="card-body">
                    <div id="ram-text" class="mb-2 fw-bold">-- / -- GB</div>
                    <div class="progress mb-2" style="height: 25px;">
                        <div id="ram-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%">0%</div>
                    </div>
                    <small class="text-muted">Использовано / Всего</small>
                </div>
            </div>
        </div>

        <!-- GPU -->
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-header bg-warning text-dark">🎮 GPU (RTX 3060)</div>
                <div class="card-body">
                    <div id="gpu-vram" class="mb-2 fw-bold">VRAM: -- / -- MB</div>
                    <div class="progress mb-2" style="height: 25px;">
                        <div id="gpu-bar" class="progress-bar bg-warning text-dark" role="progressbar" style="width: 0%">0%</div>
                    </div>
                    <div>🌡️ Температура: <span id="gpu-temp">--</span>°C</div>
                    <small id="gpu-error" class="text-danger d-none">⚠️ GPU недоступен</small>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <span class="badge bg-secondary">🔄 Автообновление: каждые 3 сек</span>
        <button class="btn btn-sm btn-outline-secondary ms-2" onclick="fetchMetrics()">Обновить сейчас</button>
    </div>
</div>

<script>
    async function fetchMetrics() {
        try {
            const res = await fetch("{{ url_for('system_monitor.api_metrics') }}");
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();

            // CPU
            const cpuPct = Math.round(data.cpu);
            document.getElementById('cpu-bar').style.width = cpuPct + '%';
            document.getElementById('cpu-bar').textContent = cpuPct + '%';

            // RAM
            const ram = data.ram;
            document.getElementById('ram-bar').style.width = ram.percent + '%';
            document.getElementById('ram-bar').textContent = Math.round(ram.percent) + '%';
            document.getElementById('ram-text').textContent = ram.used_gb + ' / ' + ram.total_gb + ' GB';

            // GPU
            const gpu = data.gpu;
            if (gpu.error) {
                document.getElementById('gpu-error').classList.remove('d-none');
                document.getElementById('gpu-bar').style.width = '0%';
            } else {
                document.getElementById('gpu-error').classList.add('d-none');
                const util = Math.round(gpu.util);
                document.getElementById('gpu-bar').style.width = util + '%';
                document.getElementById('gpu-bar').textContent = util + '%';
                document.getElementById('gpu-vram').textContent =
                    'VRAM: ' + Math.round(gpu.mem_used) + ' / ' + Math.round(gpu.mem_total) + ' MB';
                document.getElementById('gpu-temp').textContent = Math.round(gpu.temp);
            }
        } catch (e) {
            console.error('Ошибка загрузки метрик:', e);
        }
    }

    // Запуск: сразу + интервал 3 сек
    fetchMetrics();
    setInterval(fetchMetrics, 3000);
</script>
{% endblock %}
